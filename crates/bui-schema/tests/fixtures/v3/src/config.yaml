# Hysteria2 服务器配置 — Direct 实例 (v3.5)
# 生成时间: Fri May  1 00:00:00 UTC 2026

listen: :10000,20000-30000

tls:
  sniGuard: disable
  cert: /opt/b-ui/certs/fullchain.pem
  key: /opt/b-ui/certs/privkey.pem

quic:
  maxIdleTimeout: 60s

ignoreClientBandwidth: true

# DoH 防 DNS 投毒（hy2 v2.x 原生支持）
resolver:
  type: https
  https:
    addr: "1.1.1.1:443"
    sni: cloudflare-dns.com

auth:
  type: userpass
  userpass:
    alice: pw-alice-01
    bob: pw-bob-02
    carol: pw-carol-03
    dave: pw-dave-04

trafficStats:
  listen: 127.0.0.1:9999
  secret: ""

masquerade:
  type: proxy
  proxy:
    url: https://www.bing.com
    rewriteHost: true

sniff:
  enable: true
  timeout: 2s
  rewriteDomain: true
  tcpPorts: 80,443,8000-9000
  udpPorts: 443,53

# v3.6.0: 出站只走 IPv4（VPS 无 IPv6 出口；mode 4 = 只拨 IPv4，解析不到 A 记录即失败）
outbounds:
  - name: direct
    type: direct
    direct:
      mode: 4
