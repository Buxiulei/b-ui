# B-UI Clash Meta 订阅配置
# 用户: bob
# 生成时间: 2026-09-11T14:39:13.817Z

mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

ipv6: true

# 以下 tun/ipv6/IP-CIDR6 三处为 v4 在 v3 输出之上新增（2026-09-12 裁决），其余与 v3 一字不差
tun:
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  dns-hijack:
    - any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "example.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "example.com": "223.5.5.5"
  fallback:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: "bob-HY2住宅"
    type: hysteria2
    server: example.com
    port: 40000
    ports: "41000-50000"
    hop-interval: 30
    password: "bob:pw-bob-02"
    sni: example.com
    skip-cert-verify: false
    alpn:
      - h3
    obfs: salamander
    obfs-password: "obfs-pw-test"

proxy-groups:
  - name: "住宅自动"
    type: url-test
    proxies:
      - "bob-HY2住宅"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "PROXY"
    type: select
    proxies:
      - "住宅自动"
      - "bob-HY2住宅"

rules:
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOIP,cn,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - IP-CIDR6,::/0,REJECT,no-resolve
  - MATCH,住宅自动
