mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

ipv6: true

# 4.1.6: business routes use authorized proxies or reject; bootstrap DNS is separate
tun:
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  dns-hijack:
    - any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "example.com"
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://8.8.8.8/dns-query#直连自动
  proxy-server-nameserver:
    - 223.5.5.5

proxies:
  - name: "dave-Reality直连"
    type: vless
    server: example.com
    port: 10001
    uuid: 44444444-4444-4444-8444-444444444444
    flow: xtls-rprx-vision
    tls: true
    udp: true
    servername: www.bing.com
    client-fingerprint: chrome
    reality-opts:
      public-key: xpkTHqtLnYuBcHoV5_MgPY0MEjbMCHjkyKruMhDfbjY
      short-id: 0123456789abcdef
    network: tcp
  - name: "dave-HY2直连"
    type: hysteria2
    server: example.com
    port: 10000
    ports: "20000-30000"
    hop-interval: 30
    password: "dave:pw-dave-04"
    sni: example.com
    skip-cert-verify: false
    alpn:
      - h3
    obfs: salamander
    obfs-password: "obfs-pw-test"

proxy-groups:
  - name: "直连自动"
    type: url-test
    proxies:
      - "dave-Reality直连"
      - "dave-HY2直连"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "PROXY"
    type: select
    proxies:
      - "直连自动"
      - "dave-Reality直连"
      - "dave-HY2直连"

rules:
  - GEOIP,private,REJECT,no-resolve
  - IP-CIDR6,fc00::/7,REJECT,no-resolve
  - IP-CIDR6,fe80::/10,REJECT,no-resolve
  - IP-CIDR6,::/0,REJECT,no-resolve
  - MATCH,直连自动
