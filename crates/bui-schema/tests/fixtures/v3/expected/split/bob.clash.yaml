# B-UI Clash Meta 订阅配置
# 用户: bob
# 生成时间: 2026-09-11T14:39:13.406Z

mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

ipv6: true

# 4.1.6: business routes use authorized proxies or reject; bootstrap DNS is separate
tun:
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  dns-hijack:
    - any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "example.com"
  default-nameserver:
    - 223.5.5.5
  nameserver:
    - https://8.8.8.8/dns-query#住宅自动
  proxy-server-nameserver:
    - 223.5.5.5

proxies:
  - name: "bob-HY2住宅"
    type: hysteria2
    server: example.com
    port: 40000
    ports: "41000-50000"
    hop-interval: 30
    password: "bob:pw-bob-02"
    sni: example.com
    skip-cert-verify: false
    alpn:
      - h3

proxy-groups:
  - name: "住宅自动"
    type: url-test
    proxies:
      - "bob-HY2住宅"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "PROXY"
    type: select
    proxies:
      - "住宅自动"
      - "bob-HY2住宅"

rules:
  - GEOIP,private,REJECT,no-resolve
  - IP-CIDR6,fc00::/7,REJECT,no-resolve
  - IP-CIDR6,fe80::/10,REJECT,no-resolve
  - IP-CIDR6,::/0,REJECT,no-resolve
  - MATCH,住宅自动
