# B-UI Clash Meta 订阅配置
# 用户: alice
# 生成时间: 2026-09-11T14:39:13.361Z

mode: rule
log-level: warning
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

ipv6: true

# 以下 tun/ipv6/IP-CIDR6 三处为 v4 在 v3 输出之上新增（2026-09-12 裁决），其余与 v3 一字不差
tun:
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  dns-hijack:
    - any:53

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "example.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    "example.com": "223.5.5.5"
  fallback:
    - https://8.8.8.8/dns-query
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN

proxies:
  - name: "alice-Reality直连"
    type: vless
    server: example.com
    port: 10001
    uuid: 11111111-1111-4111-8111-111111111111
    flow: xtls-rprx-vision
    tls: true
    udp: true
    servername: www.bing.com
    client-fingerprint: chrome
    reality-opts:
      public-key: xpkTHqtLnYuBcHoV5_MgPY0MEjbMCHjkyKruMhDfbjY
      short-id: 0123456789abcdef
    network: tcp
  - name: "alice-Reality住宅"
    type: vless
    server: example.com
    port: 10002
    uuid: 11111111-1111-4111-8111-111111111111
    flow: xtls-rprx-vision
    tls: true
    udp: true
    servername: www.bing.com
    client-fingerprint: chrome
    reality-opts:
      public-key: xpkTHqtLnYuBcHoV5_MgPY0MEjbMCHjkyKruMhDfbjY
      short-id: 0123456789abcdef
    network: tcp
  - name: "alice-HY2直连"
    type: hysteria2
    server: example.com
    port: 10000
    ports: "20000-30000"
    hop-interval: 30
    password: "alice:pw-alice-01"
    sni: example.com
    skip-cert-verify: false
    alpn:
      - h3
  - name: "alice-HY2住宅"
    type: hysteria2
    server: example.com
    port: 40000
    ports: "41000-50000"
    hop-interval: 30
    password: "alice:pw-alice-01"
    sni: example.com
    skip-cert-verify: false
    alpn:
      - h3

proxy-groups:
  - name: "直连自动"
    type: url-test
    proxies:
      - "alice-Reality直连"
      - "alice-HY2直连"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "住宅自动"
    type: url-test
    proxies:
      - "alice-Reality住宅"
      - "alice-HY2住宅"
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "PROXY"
    type: select
    proxies:
      - "直连自动"
      - "住宅自动"
      - "alice-Reality直连"
      - "alice-HY2直连"
      - "alice-Reality住宅"
      - "alice-HY2住宅"

