listen: :40000,41000-50000
tls:
  sniGuard: disable
  cert: /opt/b-ui/certs/fullchain.pem
  key: /opt/b-ui/certs/privkey.pem
quic:
  maxIdleTimeout: 60s
ignoreClientBandwidth: true
resolver:
  type: https
  https:
    addr: 1.1.1.1:443
    sni: cloudflare-dns.com
auth:
  type: command
  command: /opt/b-ui/bin/bui-auth-hook
trafficStats:
  listen: 127.0.0.1:9998
  secret: ''
masquerade:
  type: proxy
  proxy:
    url: https://www.bing.com
    rewriteHost: true
sniff:
  enable: true
  timeout: 2s
  rewriteDomain: true
  tcpPorts: 80,443,8000-9000
  udpPorts: 443,53
outbounds:
- name: relay
  type: socks5
  socks5:
    addr: 127.0.0.1:2080
- name: direct
  type: direct
  direct:
    mode: 4
acl:
  inline:
  - relay(all)
