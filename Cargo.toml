[workspace]
resolver = "2"
members = ["crates/bui-schema", "crates/bui", "crates/bui-c"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
percent-encoding = "2"
url = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
