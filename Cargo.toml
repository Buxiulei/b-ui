[workspace]
resolver = "2"
members = ["crates/bui-schema", "crates/bui", "crates/bui-c"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "4.0.2"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
percent-encoding = "2"
url = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
argon2 = "0.5"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", default-features = false, features = ["user"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "socks",
] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
