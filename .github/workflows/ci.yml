name: CI

on:
  push:
    branches: [v4]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  nft:
    name: nft packet regression
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Network namespace test tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nftables iproute2 python3
      - name: Build isolated packet test
        run: |
          cargo test -p bui-schema --test kernel_nft --no-run --message-format=json > /tmp/nft-build.jsonl
          python3 - <<'PY' > /tmp/nft-test-bin
          import json
          for line in open('/tmp/nft-build.jsonl'):
              item = json.loads(line)
              if item.get('executable') and item.get('target', {}).get('name') == 'kernel_nft':
                  print(item['executable'])
          PY
          test -s /tmp/nft-test-bin
      - name: Verify real IPv4 and IPv6 packets in isolated namespaces
        run: sudo "$(cat /tmp/nft-test-bin)" --ignored --nocapture

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # 发布门禁预检判的是提交祖先关系，默认浅克隆（depth 1）拿不到 ⇒ 必须取全量历史。
        with:
          fetch-depth: 0
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: rustfmt / clippy 组件
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 面板节点交付契约（实际 app.js）
        run: node scripts/tests/test-panel-node-uri.cjs
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - name: 收集脚本清单
        id: scripts
        run: |
          set -euo pipefail
          # 不用 'scripts/**/*.sh' 这种 pathspec：git 的 ** 要求中间至少一层目录，
          # 直接放在 scripts/ 下的脚本会被漏掉（本机在 server/**/*.sh 上实测过漏匹配）。
          {
            printf 'files<<EOF\n'
            git ls-files -- install.sh scripts | grep -E '\.sh$'
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      - name: bash -n
        run: |
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            bash -n "$f"
          done <<< '${{ steps.scripts.outputs.files }}'
      - name: shellcheck -S error
        run: |
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            shellcheck -S error "$f"
          done <<< '${{ steps.scripts.outputs.files }}'
      - name: 解包工具（脚本测试要 zip/unzip）
        run: sudo apt-get install -y --no-install-recommends zip unzip
      - name: shell 脚本测试
        run: bash scripts/tests/run-all.sh
      - name: 版本号三处一致
        run: bash scripts/release/check-version.sh
      - name: 发布门禁预检（只告警，不卡 CI）
        run: |
          set -euo pipefail
          ver=$(awk '/^\[workspace\.package\]/ {f = 1; next} f && /^\[/ {f = 0} f && /^version[[:space:]]*=/ {gsub(/[^0-9.]/, ""); print; exit}' Cargo.toml)
          bash scripts/release/check-release-gate.sh "v$ver" --warn
      - name: 内核 lock 没有漂移出轨道
        run: bash scripts/release/pin-kernels.sh --check

  test:
    name: test (sing-box 1.14.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: 准备内核
        uses: ./.github/actions/setup-kernels
        with:
          dir: ${{ runner.temp }}/kernels-amd64
          arch: amd64
      - name: 把发布内核放到 PATH 首位
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/pathbin"
          mkdir -p "$BIN"
          ln -sf "$RUNNER_TEMP/kernels-amd64/bin/sing-box" "$BIN/sing-box"
          ln -sf "$RUNNER_TEMP/kernels-amd64/bin/xray" "$BIN/xray"
          ln -sf "$RUNNER_TEMP/kernels-amd64/bin/hysteria" "$BIN/hysteria"
          echo "$BIN" >> "$GITHUB_PATH"
          # caddy 的 validate 用例（core_files.rs）不查 PATH，只认三个绝对路径，
          # 而 ubuntu-24.04 镜像不预装 caddy：软链进 /usr/local/bin 才能真跑校验。
          sudo ln -sf "$RUNNER_TEMP/kernels-amd64/bin/caddy" /usr/local/bin/caddy
          caddy version | head -1
      - name: cargo test（渲染结果过真实内核）
        run: |
          set -euo pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"
          # 配置和真实流量只验发布内核；二进制缺失或漏编计量能力均不接受 skip。
          if grep -Eq 'skipped: ((sing-box|xray|hysteria) not found|本机没有 caddy 二进制|自建 sing-box（with_v2ray_api）不可用)' "$RUNNER_TEMP/test.log"; then
            echo "内核校验被跳过：CI 不接受 skip"
            grep -E 'skipped: ' "$RUNNER_TEMP/test.log"
            exit 1
          fi
      - name: 住宅 UDP 实际收发（发布内核）
        run: cargo test -p bui-schema --test kernel_traffic -- --ignored --nocapture
