name: CI

on:
  push:
    branches: [v4]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # 发布门禁预检判的是提交祖先关系，默认浅克隆（depth 1）拿不到 ⇒ 必须取全量历史。
        with:
          fetch-depth: 0
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: rustfmt / clippy 组件
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      - name: 收集脚本清单
        id: scripts
        run: |
          set -euo pipefail
          # 不用 'scripts/**/*.sh' 这种 pathspec：git 的 ** 要求中间至少一层目录，
          # 直接放在 scripts/ 下的脚本会被漏掉（本机在 server/**/*.sh 上实测过漏匹配）。
          {
            printf 'files<<EOF\n'
            git ls-files -- install.sh scripts | grep -E '\.sh$'
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"
      - name: bash -n
        run: |
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            bash -n "$f"
          done <<< '${{ steps.scripts.outputs.files }}'
      - name: shellcheck -S error
        run: |
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            shellcheck -S error "$f"
          done <<< '${{ steps.scripts.outputs.files }}'
      - name: 解包工具（脚本测试要 zip/unzip）
        run: sudo apt-get install -y --no-install-recommends zip unzip
      - name: shell 脚本测试
        run: bash scripts/tests/run-all.sh
      - name: 版本号三处一致
        run: bash scripts/release/check-version.sh
      - name: 发布门禁预检（只告警，不卡 CI）
        run: |
          set -euo pipefail
          ver=$(awk '/^\[workspace\.package\]/ {f = 1; next} f && /^\[/ {f = 0} f && /^version[[:space:]]*=/ {gsub(/[^0-9.]/, ""); print; exit}' Cargo.toml)
          bash scripts/release/check-release-gate.sh "v$ver" --warn
      - name: 内核 lock 没有漂移出轨道
        run: bash scripts/release/pin-kernels.sh --check

  test:
    name: test (${{ matrix.singbox }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        singbox: ["1.12", "1.13", "1.14"]
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: 准备内核
        uses: ./.github/actions/setup-kernels
        with:
          dir: ${{ runner.temp }}/kernels-amd64
          role: all
          arch: amd64
      - name: 把本矩阵的 sing-box 放到 PATH 首位
        run: |
          set -euo pipefail
          BIN="$RUNNER_TEMP/pathbin"
          mkdir -p "$BIN"
          SB="$RUNNER_TEMP/kernels-amd64/singbox/${{ matrix.singbox }}/sing-box"
          if [[ ! -x "$SB" ]]; then
            # target minor（1.14）不在 check 目录里，走 bin/ 那一份 —— 也就是**自建**的那个
            # （带 with_v2ray_api）。1.12 / 1.13 两格仍是上游归档、不带这个标签（spec §5.3）。
            SB="$RUNNER_TEMP/kernels-amd64/bin/sing-box"
          fi
          ln -sf "$SB" "$BIN/sing-box"
          ln -sf "$RUNNER_TEMP/kernels-amd64/bin/xray" "$BIN/xray"
          ln -sf "$RUNNER_TEMP/kernels-amd64/bin/hysteria" "$BIN/hysteria"
          echo "$BIN" >> "$GITHUB_PATH"
          # caddy 的 validate 用例（core_files.rs）不查 PATH，只认三个绝对路径，
          # 而 ubuntu-24.04 镜像不预装 caddy：软链进 /usr/local/bin 才能真跑校验。
          sudo ln -sf "$RUNNER_TEMP/kernels-amd64/bin/caddy" /usr/local/bin/caddy
          caddy version | head -1
      - name: 确认版本就是矩阵要求的
        run: |
          set -euo pipefail
          got=$(sing-box version | awk '/^sing-box version/ {print $3; exit}')
          echo "sing-box = $got"
          case "$got" in ${{ matrix.singbox }}.*) ;; *) echo "版本不符：期望 ${{ matrix.singbox }}.x"; exit 1 ;; esac
      - name: cargo test（渲染结果过真实内核）
        run: |
          set -euo pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test.log"
          # 只判「内核校验漏跑」这一种 skip：内核二进制没在 PATH 上（含带版本后缀的形态，
          # 如 `skipped: sing-box-1.12 not found`），或 caddy 不在三个绝对路径上。
          # 白名单——这三条 skip 在 CI 里必然出现、也本该出现，放行：
          #   skipped: sing-box-1.12 not found / -1.13 / -1.14
          # 它们是 crates/bui-schema/tests/common/mod.rs 的 check_singbox_all 除默认名外额外
          # 找的多版本二进制。本 job 每格只装默认名 sing-box 的矩阵版本，并由上一步
          # `sing-box version` 守门钉死大版本，1.12/1.13/1.14 三版覆盖由三格矩阵提供，
          # 带后缀的二进制在 CI 里根本不存在。给 check_singbox_all 加新版本时要同时加进
          # matrix.singbox 与这条白名单，否则新版本漏跑会判红——这正是要的。
          # 测试里另有几种设计内的 skip（缺 P0 的 v3 fixture、P5 删掉 server/core.sh 后的
          # v3 sysctl 对照、openssl 不可用、开发机设了域名环境变量），不是内核校验，天然不匹配。
          # 住宅 HY2 那份配置只在**自建**的 1.14 上过 check（v2ray_api 段要 with_v2ray_api），
          # 1.12 / 1.13 两格是上游归档、必然 skip，所以这种 skip 也进白名单。
          kernel_skips=$(grep -E 'skipped: ((sing-box|xray|hysteria)(-[0-9.]+)? not found|本机没有 caddy 二进制|自建 sing-box（with_v2ray_api）不可用)' "$RUNNER_TEMP/test.log" || true)
          missed=$(printf '%s\n' "$kernel_skips" | grep -Ev 'skipped: (sing-box-1\.(12|13|14) not found|自建 sing-box（with_v2ray_api）不可用)' || true)
          if [[ -n "$missed" ]]; then
            echo "内核校验被跳过，说明没找到内核二进制：CI 不接受 skip"
            printf '%s\n' "$missed"
            exit 1
          fi
